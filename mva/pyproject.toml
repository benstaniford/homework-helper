[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mva-canvas"
version = "0.1.0"
description = "Python API for the Minerva Virtual Academy Canvas instance: courses, homework, and materials."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Canvas API; requires CANVAS_TOKEN (deselect with -m 'not live')",
]
